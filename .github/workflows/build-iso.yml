name: Build WipeSure Universal ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Run ISO Builder
      run: |
        sudo apt-get update
        sudo apt-get install -y live-build live-boot live-config syslinux squashfs-tools genisoimage xorriso grub-pc-bin grub-efi-amd64-bin mtools dosfstools build-essential libssl-dev debian-archive-keyring fdisk debootstrap
        chmod +x build_iso.sh
        sudo ./build_iso.sh

    - name: Upload ISO Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WipeSure-Universal-Boot
        path: WipeSure-Universal-Boot.iso
        if-no-files-found: error
